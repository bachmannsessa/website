{{ define "main" }}
{{ partial "hero.html" (dict "page" .) }}
{{- with .Content }}
<div class="post__body prose">{{ . }}</div>
{{- end }}
{{- with .RegularPages.ByWeight }}
<section class="sec sec--tint sec--cards">
  <div class="sec__inner">
    <div class="cards">{{ range . }}{{ partial "card.html" . }}{{ end }}</div>
  </div>
</section>
{{- end }}
{{ end }}
