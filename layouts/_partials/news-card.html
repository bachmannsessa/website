{{- $i := partial "page-image.html" . -}}
<a class="news-card reveal" href="{{ .RelPermalink }}">
  <div class="news-card__img">{{ partial "picture.html" (dict "src" $i.src "position" $i.position "sizes" "(max-width: 800px) 100vw, 380px" "widths" (slice 480 960)) }}</div>
  <p class="eyebrow"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
  <h3>{{ .Title }}</h3>
  <p>{{ .Summary | plainify | htmlUnescape | truncate 160 }}</p>
</a>
